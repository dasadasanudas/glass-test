name: lgx-capture
on:
  push:
    branches: [main]
    paths: ['lgx/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pick:
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.p.outputs.label }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: echo "label=$(tr -d ' \r\n' < lgx/runner.txt 2>/dev/null || echo macos-26)" >> "$GITHUB_OUTPUT"
  cap:
    needs: pick
    runs-on: ${{ needs.pick.outputs.label || 'macos-26' }}
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - run: bash lgx/run.sh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lgx-cap
          path: ${{ runner.temp }}/lgx-cap
