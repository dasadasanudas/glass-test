name: lgx-capture
on:
  push:
    branches: [main]
    paths: ['lgx/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cap:
    runs-on: macos-26
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - run: bash lgx/run.sh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lgx-cap
          path: ${{ runner.temp }}/lgx-cap
