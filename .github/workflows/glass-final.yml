          ( i=0; while [ $i -lt 700 ] && [ ! -f "$OUT/.stop" ]; do screencapture -x -t jpg "$OUT/frames/f_$(printf %04d $i)_$(date +%s.%N | cut -c1-14).jpg" 2>/dev/null; i=$((i+1)); sleep 0.15; done ) &
