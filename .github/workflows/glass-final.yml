name: glass-final
on: workflow_dispatch
jobs:
  glass:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Active glass, parameter sweep, interaction video
        shell: bash
        run: |
          GITHUB_WORKSPACE_SCRIPTS="$RUNNER_TEMP/scripts"; mkdir -p "$GITHUB_WORKSPACE_SCRIPTS"
          set +e
          cat > "$GITHUB_WORKSPACE_SCRIPTS/inspect5.m" <<'OBJC_EOF'
          #import <AppKit/AppKit.h>
          #import <QuartzCore/QuartzCore.h>
          #import <objc/runtime.h>
          #import <objc/message.h>
          #import <dlfcn.h>
          #import <ApplicationServices/ApplicationServices.h>
          #ifndef GLASS_BEZEL
          #define GLASS_BEZEL -1
          #endif

          static FILE *F = NULL;
          static void P(NSString *s) { if (F) { fprintf(F, "%s\n", [s UTF8String]); fflush(F); } }
          static void openOut(NSString *dir, NSString *name) {
              if (F) fclose(F);
              F = fopen([[dir stringByAppendingPathComponent:name] UTF8String], "w");
          }

          static NSString *clip(id v) {
              NSString *d = [[v description] stringByReplacingOccurrencesOfString:@"\n" withString:@" "];
              if ([d length] > 600) d = [[d substringToIndex:600] stringByAppendingString:@"..."];
              return d ? d : @"(nil)";
          }

          static BOOL safeType(const char *a) {
              if (!a || strlen(a) < 2) return NO;
              char t = a[1];
              if (t == '^' || t == '*' || t == ':' || t == '#' || t == '?' || t == 'r') return NO;
              if (t == '@' && a[2] == '?') return NO;
              return YES;
          }

          static void dumpProps(id o, NSString *ind, Class stopAt) {
              NSSet *skip = [NSSet setWithObjects:@"delegate", @"sublayers", @"subviews", @"superlayer", @"superview", @"window",
                             @"contents", @"layoutManager", @"mask", @"style", @"actions", @"description", @"debugDescription",
                             @"hash", @"superclass", @"context", @"presentationLayer", @"modelLayer", @"nextResponder",
                             @"menu", @"layer", @"contentView", @"enclosingScrollView", nil];
              NSMutableSet *seen = [NSMutableSet set];
              Class c = object_getClass(o);
              while (c && c != [NSObject class] && c != stopAt) {
                  unsigned int n = 0;
                  objc_property_t *ps = class_copyPropertyList(c, &n);
                  for (unsigned int i = 0; i < n; i++) {
                      NSString *pn = [NSString stringWithUTF8String:property_getName(ps[i])];
                      const char *a = property_getAttributes(ps[i]);
                      if ([seen containsObject:pn] || [skip containsObject:pn] || !safeType(a)) continue;
                      [seen addObject:pn];
                      @try {
                          id v = [o valueForKey:pn];
                          P([NSString stringWithFormat:@"%@.%@ = %@", ind, pn, clip(v)]);
                      } @catch (NSException *e) { }
                  }
                  free(ps);
                  c = class_getSuperclass(c);
              }
          }

          static void dumpFilter(id f, NSString *ind) {
              P([NSString stringWithFormat:@"%@filter %s : %@", ind, class_getName(object_getClass(f)), clip(f)]);
              for (NSString *k in @[@"name", @"type", @"enabled", @"inputKeys", @"outputKeys"]) {
                  @try { if ([f respondsToSelector:NSSelectorFromString(k)]) P([NSString stringWithFormat:@"%@  .%@ = %@", ind, k, clip([f valueForKey:k])]); } @catch (NSException *e) { }
              }
              @try {
                  if ([f respondsToSelector:NSSelectorFromString(@"inputKeys")]) {
                      for (NSString *k in [f valueForKey:@"inputKeys"]) {
                          @try { P([NSString stringWithFormat:@"%@  [%@] = %@", ind, k, clip([f valueForKey:k])]); } @catch (NSException *e) { }
                      }
                  }
              } @catch (NSException *e) { }
              dumpProps(f, [ind stringByAppendingString:@"  "], [NSObject class]);
          }

          static void walk(CALayer *l, int depth) {
              if (!l || depth > 30) return;
              NSString *ind = [@"" stringByPaddingToLength:depth * 2 withString:@" " startingAtIndex:0];
              CGRect fr = [l frame];
              P([NSString stringWithFormat:@"%@<%s> frame={%.1f,%.1f,%.1f,%.1f} cornerRadius=%.2f opacity=%.2f",
                 ind, class_getName(object_getClass(l)), fr.origin.x, fr.origin.y, fr.size.width, fr.size.height, [l cornerRadius], [l opacity]]);
              for (NSString *k in @[@"filters", @"backgroundFilters", @"compositingFilter"]) {
                  id v = nil;
                  @try { v = [l valueForKey:k]; } @catch (NSException *e) { }
                  if (!v) continue;
                  NSArray *arr = [v isKindOfClass:[NSArray class]] ? v : @[v];
                  for (id f in arr) { P([NSString stringWithFormat:@"%@  %@:", ind, k]); dumpFilter(f, [ind stringByAppendingString:@"    "]); }
              }
              if (object_getClass(l) != [CALayer class]) dumpProps(l, [ind stringByAppendingString:@"    "], [CALayer class]);
              for (NSString *k in @[@"effect", @"effects", @"sdfEffects", @"material", @"glassEffect"]) {
                  @try {
                      if ([l respondsToSelector:NSSelectorFromString(k)]) {
                          id v = [l valueForKey:k];
                          if (v) { P([NSString stringWithFormat:@"%@    effect-ish %@:", ind, k]); dumpFilter(v, [ind stringByAppendingString:@"      "]); }
                      }
                  } @catch (NSException *e) { }
              }
              for (CALayer *s in [[l sublayers] copy]) walk(s, depth + 1);
          }


          static void findGlassFilters(CALayer *l, NSMutableArray *acc, int depth) {
              if (!l || depth > 40) return;
              id v = nil;
              @try { v = [l valueForKey:@"filters"]; } @catch (NSException *e) { }
              if ([v isKindOfClass:[NSArray class]]) {
                  for (id f in v) {
                      @try {
                          if ([[f valueForKey:@"type"] isEqual:@"glassBackground"] || [[f valueForKey:@"type"] isEqual:@"glassForeground"] || [[f valueForKey:@"type"] isEqual:@"vibrantColorMatrix"]) {
                              CALayer *top = l; while ([top superlayer]) top = [top superlayer];
                              CGRect r = [l convertRect:[l bounds] toLayer:top];
                              [acc addObject:@[f, [NSString stringWithFormat:@"@(%.0f,%.0f %.0fx%.0f)", r.origin.x, r.origin.y, r.size.width, r.size.height]]];
                          }
                      } @catch (NSException *e) { }
                  }
              }
              for (CALayer *s in [[l sublayers] copy]) findGlassFilters(s, acc, depth + 1);
          }

          static NSString *filterLine(id pair) {
              NSMutableString *m = [NSMutableString string];
              id f = pair;
              if ([pair isKindOfClass:[NSArray class]]) { f = pair[0]; [m appendFormat:@"%@ ", pair[1]]; }
              @try {
                  [m appendFormat:@"%@:", [f valueForKey:@"type"]];
                  for (NSString *k in [f valueForKey:@"inputKeys"]) {
                      id v = nil;
                      @try { v = [f valueForKey:k]; } @catch (NSException *e) { }
                      if ([v isKindOfClass:[NSNumber class]]) [m appendFormat:@" %@=%@", [k stringByReplacingOccurrencesOfString:@"input" withString:@""], v];
                      else if (v && [k rangeOfString:@"Color"].location != NSNotFound) [m appendFormat:@" %@=%@", [k stringByReplacingOccurrencesOfString:@"input" withString:@""], clip(v)];
                  }
              } @catch (NSException *e) { }
              return m;
          }

          static CFAbsoluteTime REC0 = 0;
          static FILE *TL = NULL;
          static void T(NSString *what) {
              if (!TL) return;
              fprintf(TL, "%.3f  %s\n", CFAbsoluteTimeGetCurrent() - REC0, [what UTF8String]); fflush(TL);
          }
          static CGPoint globalPt(NSWindow *w, NSView *v, CGFloat fx, CGFloat fy) {
              __block CGPoint g = CGPointZero;
              void (^calc)(void) = ^{
                  NSRect r = [v convertRect:[v bounds] toView:nil];
                  NSPoint p = NSMakePoint(NSMinX(r) + fx * NSWidth(r), NSMinY(r) + fy * NSHeight(r));
                  NSPoint sp = [w convertPointToScreen:p];
                  CGFloat H = NSMaxY([[[NSScreen screens] objectAtIndex:0] frame]);
                  g = CGPointMake(sp.x, H - sp.y);
              };
              if ([NSThread isMainThread]) calc(); else dispatch_sync(dispatch_get_main_queue(), calc);
              return g;
          }
          static CGPoint CUR = {5, 5};
          static NSWindow *WIN = nil;
          static int ACCESS = -1;
          static void post(CGEventType t, CGPoint p) {
              if (ACCESS < 0) ACCESS = CGPreflightPostEventAccess() ? 1 : 0;
              CUR = p;
              if (ACCESS == 1) {
                  CGEventRef e = CGEventCreateMouseEvent(NULL, t, p, kCGMouseButtonLeft);
                  if (e) { CGEventPost(kCGHIDEventTap, e); CFRelease(e); }
                  return;
              }
              // fallback: move the real cursor + feed events straight into our own app
              CGWarpMouseCursorPosition(p);
              NSEventType nt;
              if (t == kCGEventLeftMouseDown) nt = NSEventTypeLeftMouseDown;
              else if (t == kCGEventLeftMouseUp) nt = NSEventTypeLeftMouseUp;
              else if (t == kCGEventLeftMouseDragged) nt = NSEventTypeLeftMouseDragged;
              else nt = NSEventTypeMouseMoved;
              dispatch_async(dispatch_get_main_queue(), ^{
                  CGFloat H = NSMaxY([[[NSScreen screens] objectAtIndex:0] frame]);
                  NSPoint wp = [WIN convertPointFromScreen:NSMakePoint(p.x, H - p.y)];
                  NSEvent *e = [NSEvent mouseEventWithType:nt location:wp modifierFlags:0 timestamp:[[NSProcessInfo processInfo] systemUptime]
                                              windowNumber:[WIN windowNumber] context:nil eventNumber:0 clickCount:1 pressure:(nt == NSEventTypeLeftMouseUp ? 0.0 : 1.0)];
                  if (e) [NSApp postEvent:e atStart:NO];
              });
          }
          static void glide(CGPoint to, double secs, BOOL dragging) {
              CGPoint from = CUR;
              int n = (int)(secs * 60.0); if (n < 1) n = 1;
              for (int i = 1; i <= n; i++) {
                  double t = (double)i / n; t = t * t * (3 - 2 * t);
                  post(dragging ? kCGEventLeftMouseDragged : kCGEventMouseMoved, CGPointMake(from.x + (to.x - from.x) * t, from.y + (to.y - from.y) * t));
                  usleep(16000);
              }
          }
          static void sampleGlass(NSView *v, NSString *tag) {
              dispatch_async(dispatch_get_main_queue(), ^{
                  NSMutableArray *fs = [NSMutableArray array];
                  findGlassFilters([[WIN contentView] layer], fs, 0);
                  NSString *hl = @"";
                  if ([v isKindOfClass:[NSButton class]]) hl = [NSString stringWithFormat:@" highlighted=%d", [(NSButton *)v isHighlighted]];
                  if ([fs count] == 0) T([NSString stringWithFormat:@"SAMPLE %@%@ | no glass filter", tag, hl]);
                  for (id f in fs) T([NSString stringWithFormat:@"SAMPLE %@%@ | %@", tag, hl, filterLine(f)]);
              });
          }

          static void pump(double s) { [[NSRunLoop currentRunLoop] runUntilDate:[NSDate dateWithTimeIntervalSinceNow:s]]; }

          int main(int argc, const char **argv) {
              @autoreleasepool {
                  NSString *out = argc > 1 ? [NSString stringWithUTF8String:argv[1]] : @".";
                  [[NSFileManager defaultManager] createDirectoryAtPath:out withIntermediateDirectories:YES attributes:nil error:nil];
                  const char *libs[] = {
                      "/System/Library/Frameworks/QuartzCore.framework/QuartzCore",
                      "/System/Library/PrivateFrameworks/RenderBox.framework/RenderBox",
                      "/System/Library/Frameworks/SwiftUI.framework/SwiftUI",
                      "/System/Library/PrivateFrameworks/CoreUI.framework/CoreUI",
                      "/System/Library/Frameworks/CoreImage.framework/CoreImage",
                      "/System/Library/PrivateFrameworks/CoreMaterial.framework/CoreMaterial" };
                  for (int i = 0; i < 6; i++) if (!dlopen(libs[i], RTLD_NOW)) fprintf(stderr, "dlopen failed %s\n", libs[i]);

                  // ---- 3. live glass, ACTIVE window, several configurations ----
                  [NSApplication sharedApplication];
                  [NSApp setActivationPolicy:NSApplicationActivationPolicyRegular];
                  [NSApp finishLaunching];
                  [NSApp activateIgnoringOtherApps:YES];
                  NSWindow *win = [[NSWindow alloc] initWithContentRect:NSMakeRect(100, 100, 900, 560)
                                                              styleMask:(NSWindowStyleMaskTitled | NSWindowStyleMaskClosable | NSWindowStyleMaskResizable | NSWindowStyleMaskFullSizeContentView)
                                                                backing:NSBackingStoreBuffered defer:NO];
                  [win setTitle:@"Glass Active"];
                  WIN = win;
                  NSToolbar *tb = [[NSToolbar alloc] initWithIdentifier:@"tb"];
                  [win setToolbar:tb];
                  NSView *root = [[NSView alloc] initWithFrame:NSMakeRect(0, 0, 900, 560)];
                  [root setWantsLayer:YES];
                  CAGradientLayer *grad = [CAGradientLayer layer];
                  grad.colors = @[(id)[[NSColor systemPinkColor] CGColor], (id)[[NSColor systemOrangeColor] CGColor], (id)[[NSColor systemBlueColor] CGColor]];
                  grad.startPoint = CGPointMake(0, 0); grad.endPoint = CGPointMake(1, 1);
                  grad.frame = root.bounds;
                  [[root layer] addSublayer:grad];
                  NSTextField *big = [NSTextField labelWithString:@"REFRACTION ||| TEST ||| 0123"];
                  [big setFont:[NSFont systemFontOfSize:60 weight:NSFontWeightHeavy]];
                  [big setFrame:NSMakeRect(20, 300, 880, 90)];
                  [root addSubview:big];
                  [win setContentView:root];
                  Class G = NSClassFromString(@"NSGlassEffectView");
                  Class GC = NSClassFromString(@"NSGlassEffectContainerView");
                  NSMutableArray *glassViews = [NSMutableArray array];
                  NSView *container = root;
                  if (GC) {
                      container = [[GC alloc] initWithFrame:root.bounds];
                      [root addSubview:container];
                  }
                  if (G) {
                      for (int i = 0; i < 3; i++) {
                          NSView *g = [[G alloc] initWithFrame:NSMakeRect(30 + i * 290, 280, 260, 130)];
                          @try { [g setValue:@(i == 1 ? 1 : 0) forKey:@"style"]; } @catch (NSException *e) { }
                          @try { [g setValue:@(i == 2 ? 65 : 28) forKey:@"cornerRadius"]; } @catch (NSException *e) { }
                          NSTextField *t = [NSTextField labelWithString:(i == 1 ? @"clear" : (i == 2 ? @"capsule" : @"regular"))];
                          @try { [g setValue:t forKey:@"contentView"]; } @catch (NSException *e) { [g addSubview:t]; }
                          [container addSubview:g];
                          [glassViews addObject:g];
                      }
                  } else { openOut(out, @"live_active_layers.txt"); P(@"NSGlassEffectView MISSING"); }
                  [win makeKeyAndOrderFront:nil];
                  [win orderFrontRegardless];
                  [NSApp activateIgnoringOtherApps:YES];
                  if ([NSApp respondsToSelector:@selector(activate)]) [NSApp performSelector:@selector(activate)];
                  for (int tries = 0; tries < 10 && ![win isKeyWindow]; tries++) {
                      [NSApp activateIgnoringOtherApps:YES];
                      if ([NSApp respondsToSelector:@selector(activate)]) [NSApp performSelector:@selector(activate)];
                      [win makeKeyAndOrderFront:nil];
                      pump(1.0);
                  }
                  pump(1.0);
                  [win makeKeyWindow];
                  [win makeMainWindow];
                  pump(2.0);
                  openOut(out, @"window_state.txt");
                  P([NSString stringWithFormat:@"isKey=%d isMain=%d appActive=%d", [win isKeyWindow], [win isMainWindow], [NSApp isActive]]);
                  NSTask *cap = [[NSTask alloc] init];
                  [cap setLaunchPath:@"/usr/sbin/screencapture"];
                  [cap setArguments:@[@"-x", @"-o", [NSString stringWithFormat:@"-l%ld", (long)[win windowNumber]], [out stringByAppendingPathComponent:@"active_window.png"]]];
                  @try { [cap launch]; [cap waitUntilExit]; } @catch (NSException *e) { }
                  NSTask *cap2 = [[NSTask alloc] init];
                  [cap2 setLaunchPath:@"/usr/sbin/screencapture"];
                  [cap2 setArguments:@[@"-x", [out stringByAppendingPathComponent:@"full_screen.png"]]];
                  @try { [cap2 launch]; [cap2 waitUntilExit]; } @catch (NSException *e) { }
                  openOut(out, @"live_active_layers.txt");
                  P([NSString stringWithFormat:@"isKey=%d isMain=%d appActive=%d", [win isKeyWindow], [win isMainWindow], [NSApp isActive]]);
                  for (NSView *g in glassViews) {
                      P(@"##### NSGlassEffectView");
                      dumpProps(g, @"  ", [NSView class]);
                  }
                  if (GC) { P(@"##### glass container view"); dumpProps(container, @"  ", [NSView class]); }
                  P(@"##### whole window content layer tree");
                  walk([root layer], 0);

                  // ---- 5. interactions on video ----
                  {
                      [win setAppearance:nil]; grad.hidden = NO;
                      for (NSView *v in glassViews) [v setHidden:YES];
                      WIN = win;
                      NSView *A = G ? [[G alloc] initWithFrame:NSMakeRect(40, 330, 220, 110)] : [[NSView alloc] initWithFrame:NSZeroRect];
                      NSView *B = G ? [[G alloc] initWithFrame:NSMakeRect(460, 330, 220, 110)] : [[NSView alloc] initWithFrame:NSZeroRect];
                      @try { [A setValue:@40 forKey:@"cornerRadius"]; [B setValue:@40 forKey:@"cornerRadius"]; } @catch (NSException *e) { }
                      [container addSubview:A]; [container addSubview:B];
                      NSButton *gb = [NSButton buttonWithTitle:@"Glass Button" target:nil action:nil];
          #if GLASS_BEZEL >= 0
                      [gb setBezelStyle:(NSBezelStyle)GLASS_BEZEL];
          #endif
                      [gb setControlSize:NSControlSizeLarge];
                      [gb setFrame:NSMakeRect(40, 230, 180, 44)];
                      NSButton *pb2 = [NSButton buttonWithTitle:@"Push Button" target:nil action:nil];
                      [pb2 setFrame:NSMakeRect(250, 236, 140, 32)];
                      NSButton *cb2 = [NSButton checkboxWithTitle:@"Checkbox" target:nil action:nil];
                      [cb2 setFrame:NSMakeRect(420, 240, 120, 24)];
                      NSSwitch *sw2 = [[NSSwitch alloc] initWithFrame:NSMakeRect(560, 236, 60, 32)];
                      NSSlider *sl2 = [NSSlider sliderWithValue:20 minValue:0 maxValue:100 target:nil action:nil];
                      [sl2 setFrame:NSMakeRect(40, 160, 300, 30)];
                      NSTextField *tf2 = [NSTextField textFieldWithString:@"Focus me"];
                      [tf2 setFrame:NSMakeRect(380, 160, 220, 26)];
                      NSSegmentedControl *sg2 = [NSSegmentedControl segmentedControlWithLabels:@[@"One", @"Two", @"Three"] trackingMode:NSSegmentSwitchTrackingSelectOne target:nil action:nil];
                      [sg2 setSelectedSegment:0];
                      [sg2 setFrame:NSMakeRect(40, 100, 240, 30)];
                      for (NSView *v in @[gb, pb2, cb2, sw2, sl2, tf2, sg2]) [container addSubview:v];
                      [win makeKeyAndOrderFront:nil];
                      pump(1.0);

                      NSString *movPath = [out stringByAppendingPathComponent:@"interaction.mov"];
                      NSTask *rec = [[NSTask alloc] init];
                      [rec setLaunchPath:@"/usr/sbin/screencapture"];
                      [rec setArguments:@[@"-v", @"-V", @"60", @"-x", movPath]];
                      REC0 = CFAbsoluteTimeGetCurrent();
                      TL = fopen([[out stringByAppendingPathComponent:@"timeline.txt"] UTF8String], "w");
                      @try { [rec launch]; } @catch (NSException *e) { T(@"screen recording failed to start"); }
                      T([NSString stringWithFormat:@"recording started; postEventAccess=%d glassBezel=%d key=%d", (int)CGPreflightPostEventAccess(), GLASS_BEZEL, [win isKeyWindow]]);

                      __block BOOL done = NO;
                      dispatch_async(dispatch_get_global_queue(QOS_CLASS_USER_INITIATED, 0), ^{
                          usleep(1500000);
                          T(@"idle"); sampleGlass(gb, @"glassButton idle"); usleep(800000);
                          T(@"hover glassButton"); glide(globalPt(win, gb, 0.5, 0.5), 0.6, NO);
                          for (int i = 0; i < 8; i++) { sampleGlass(gb, @"glassButton hover"); usleep(150000); }
                          T(@"press glassButton"); post(kCGEventLeftMouseDown, CUR);
                          for (int i = 0; i < 8; i++) { sampleGlass(gb, @"glassButton pressed"); usleep(100000); }
                          T(@"release glassButton"); post(kCGEventLeftMouseUp, CUR);
                          for (int i = 0; i < 6; i++) { sampleGlass(gb, @"glassButton released"); usleep(100000); }
                          T(@"press-drag-out glassButton"); post(kCGEventLeftMouseDown, CUR); usleep(400000);
                          glide(globalPt(win, gb, 1.6, 0.5), 0.5, YES); usleep(400000);
                          glide(globalPt(win, gb, 0.5, 0.5), 0.5, YES); usleep(300000); post(kCGEventLeftMouseUp, CUR); usleep(600000);
                          T(@"hover pushButton"); glide(globalPt(win, pb2, 0.5, 0.5), 0.5, NO); usleep(900000);
                          T(@"press pushButton"); post(kCGEventLeftMouseDown, CUR); usleep(700000); post(kCGEventLeftMouseUp, CUR); usleep(600000);
                          T(@"click checkbox"); glide(globalPt(win, cb2, 0.08, 0.5), 0.5, NO); post(kCGEventLeftMouseDown, CUR); usleep(250000); post(kCGEventLeftMouseUp, CUR); usleep(900000);
                          T(@"click switch"); glide(globalPt(win, sw2, 0.5, 0.5), 0.5, NO); post(kCGEventLeftMouseDown, CUR); usleep(120000); post(kCGEventLeftMouseUp, CUR); usleep(1200000);
                          T(@"click switch back"); post(kCGEventLeftMouseDown, CUR); usleep(120000); post(kCGEventLeftMouseUp, CUR); usleep(1200000);
                          T(@"drag slider"); glide(globalPt(win, sl2, 0.2, 0.5), 0.5, NO); post(kCGEventLeftMouseDown, CUR); usleep(300000);
                          glide(globalPt(win, sl2, 0.85, 0.5), 1.0, YES); usleep(300000); post(kCGEventLeftMouseUp, CUR); usleep(800000);
                          T(@"segmented click Three"); glide(globalPt(win, sg2, 0.83, 0.5), 0.5, NO); post(kCGEventLeftMouseDown, CUR); usleep(150000); post(kCGEventLeftMouseUp, CUR); usleep(900000);
                          T(@"focus text field"); glide(globalPt(win, tf2, 0.5, 0.5), 0.5, NO); post(kCGEventLeftMouseDown, CUR); usleep(120000); post(kCGEventLeftMouseUp, CUR); usleep(1500000);
                          T(@"move mouse away"); glide(CGPointMake(5, 700), 0.6, NO); usleep(500000);
                          T(@"morph: B moves into A");
                          dispatch_sync(dispatch_get_main_queue(), ^{
                              [NSAnimationContext runAnimationGroup:^(NSAnimationContext *ctx) { ctx.duration = 1.5; [[B animator] setFrame:NSMakeRect(200, 330, 220, 110)]; } completionHandler:nil];
                          });
                          for (int i = 0; i < 12; i++) { sampleGlass(A, @"glassA during merge"); usleep(150000); }
                          usleep(800000);
                          T(@"morph: B moves out");
                          dispatch_sync(dispatch_get_main_queue(), ^{
                              [NSAnimationContext runAnimationGroup:^(NSAnimationContext *ctx) { ctx.duration = 1.5; [[B animator] setFrame:NSMakeRect(460, 330, 220, 110)]; } completionHandler:nil];
                          });
                          usleep(2200000);
                          T(@"switch to dark");
                          dispatch_sync(dispatch_get_main_queue(), ^{ [win setAppearance:[NSAppearance appearanceNamed:NSAppearanceNameDarkAqua]]; });
                          usleep(1800000);
                          T(@"switch to light");
                          dispatch_sync(dispatch_get_main_queue(), ^{ [win setAppearance:[NSAppearance appearanceNamed:NSAppearanceNameAqua]]; });
                          usleep(1800000);
                          T(@"window inactive");
                          dispatch_sync(dispatch_get_main_queue(), ^{
                              NSWindow *o = [[NSWindow alloc] initWithContentRect:NSMakeRect(0, 0, 160, 120) styleMask:NSWindowStyleMaskTitled backing:NSBackingStoreBuffered defer:NO];
                              [o makeKeyAndOrderFront:nil];
                          });
                          usleep(1800000);
                          T(@"window active again");
                          dispatch_sync(dispatch_get_main_queue(), ^{ [win makeKeyAndOrderFront:nil]; });
                          usleep(1800000);
                          T(@"end");
                          done = YES;
                      });
                      CFAbsoluteTime limit = CFAbsoluteTimeGetCurrent() + 90;
                      while (!done && CFAbsoluteTimeGetCurrent() < limit) pump(0.03);
                      if (!done) T(@"driver timed out");
                      @try { [rec interrupt]; } @catch (NSException *e) { }
                      for (int i = 0; i < 100 && [rec isRunning]; i++) pump(0.1);
                      T(@"recording stopped");
                  }
                  // ---- 4. parameter sweep: appearance x background x size ----
                  openOut(out, @"sweep.txt");
                  if ([glassViews count] > 0) {
                      NSView *g = glassViews[0];
                      [g setHidden:NO];
                      NSArray *bgs = @[@[@"white", [NSColor whiteColor]], @[@"black", [NSColor blackColor]], @[@"gray", [NSColor grayColor]], @[@"gradient", [NSNull null]]];
                      NSArray *aps = @[@[@"light", NSAppearanceNameAqua], @[@"dark", NSAppearanceNameDarkAqua]];
                      NSArray *szs = @[@[@60, @30], @[@160, @60], @[@260, @130], @[@600, @300]];
                      for (NSArray *ap in aps) {
                          [win setAppearance:[NSAppearance appearanceNamed:ap[1]]];
                          for (NSArray *bg in bgs) {
                              if ([bg[1] isKindOfClass:[NSNull class]]) { grad.hidden = NO; }
                              else { grad.hidden = YES; [[root layer] setBackgroundColor:[(NSColor *)bg[1] CGColor]]; }
                              for (NSArray *sz in szs) {
                                  [g setFrame:NSMakeRect(30, 30, [sz[0] doubleValue], [sz[1] doubleValue])];
                                  [win makeKeyAndOrderFront:nil];
                                  pump(1.0);
                                  NSMutableArray *fs = [NSMutableArray array];
                                  findGlassFilters([root layer], fs, 0);
                                  for (id f in fs) P([NSString stringWithFormat:@"%@ %@ %@x%@ key=%d | %@", ap[0], bg[0], sz[0], sz[1], [win isKeyWindow], filterLine(f)]);
                              }
                          }
                      }

                      // private glass states: interaction (hover/press), lensing, variants
                      [win setAppearance:nil]; grad.hidden = NO;
                      [g setFrame:NSMakeRect(30, 280, 260, 130)];
                      for (NSString *k in @[@"_interactionState", @"_contentLensing", @"_subduedState", @"_scrimState", @"_variant", @"_adaptiveAppearance"]) {
                          NSNumber *orig = nil;
                          @try { orig = [g valueForKey:k]; } @catch (NSException *e) { continue; }
                          for (int val = 0; val <= 4; val++) {
                              @try { [g setValue:@(val) forKey:k]; } @catch (NSException *e) { P([NSString stringWithFormat:@"STATE %@=%d not settable", k, val]); break; }
                              pump(0.8);
                              NSMutableArray *fs = [NSMutableArray array];
                              findGlassFilters([root layer], fs, 0);
                              for (id f in fs) P([NSString stringWithFormat:@"STATE %@=%d | %@", k, val, filterLine(f)]);
                          }
                          @try { if (orig) [g setValue:orig forKey:k]; } @catch (NSException *e) { }
                          pump(0.5);
                      }
                      // inactive vs active comparison
                      [win setAppearance:nil]; grad.hidden = NO;
                      [g setFrame:NSMakeRect(30, 280, 260, 130)];
                      NSWindow *other = [[NSWindow alloc] initWithContentRect:NSMakeRect(0, 0, 200, 200) styleMask:NSWindowStyleMaskTitled backing:NSBackingStoreBuffered defer:NO];
                      [other makeKeyAndOrderFront:nil];
                      pump(1.5);
                      NSMutableArray *fs = [NSMutableArray array];
                      findGlassFilters([root layer], fs, 0);
                      for (id f in fs) P([NSString stringWithFormat:@"INACTIVE key=%d | %@", [win isKeyWindow], filterLine(f)]);
                      [win makeKeyAndOrderFront:nil];
                      pump(1.5);
                      fs = [NSMutableArray array];
                      findGlassFilters([root layer], fs, 0);
                      for (id f in fs) P([NSString stringWithFormat:@"ACTIVE key=%d | %@", [win isKeyWindow], filterLine(f)]);
                  }
                  fprintf(stderr, "done\n");
                  if (F) fclose(F);
              }
              return 0;
          }
          OBJC_EOF
          OUT="$RUNNER_TEMP/glassfinal"; mkdir -p "$OUT"
          sw_vers > "$OUT/os.txt"
          SDK=$(xcrun --show-sdk-path)
          grep -rhoE 'NSBezelStyleGlass[A-Za-z]*[^,]*' "$SDK/System/Library/Frameworks/AppKit.framework/Headers/" > "$OUT/sdk_glass_bezel.txt" 2>/dev/null
          grep -rhE 'NSGlassEffectViewStyle[A-Za-z]* *=|NSBezelStyle[A-Za-z]* *= *[0-9]+' "$SDK/System/Library/Frameworks/AppKit.framework/Headers/" >> "$OUT/sdk_glass_bezel.txt" 2>/dev/null
          GB=$(grep -hoE 'NSBezelStyleGlass *= *[0-9]+' "$SDK/System/Library/Frameworks/AppKit.framework/Headers/"*.h 2>/dev/null | grep -oE '[0-9]+$' | head -1)
          [ -z "$GB" ] && GB=-1
          echo "glass bezel = $GB"; cat "$OUT/sdk_glass_bezel.txt"
          APP="$RUNNER_TEMP/GlassProbe.app"; mkdir -p "$APP/Contents/MacOS"
          cat > "$APP/Contents/Info.plist" <<'PLIST_EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleIdentifier</key><string>dev.probe.glass</string>
          <key>CFBundleName</key><string>GlassProbe</string>
          <key>CFBundleExecutable</key><string>GlassProbe</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleShortVersionString</key><string>1.0</string>
          <key>LSMinimumSystemVersion</key><string>26.0</string>
          <key>NSPrincipalClass</key><string>NSApplication</string>
          </dict></plist>
          PLIST_EOF
          clang -fobjc-exceptions -fblocks -Wno-everything -DGLASS_BEZEL=$GB -framework AppKit -framework QuartzCore -framework ApplicationServices "$GITHUB_WORKSPACE_SCRIPTS/inspect5.m" -o "$APP/Contents/MacOS/GlassProbe" > "$OUT/compile_log.txt" 2>&1
          if [ ! -x "$APP/Contents/MacOS/GlassProbe" ] && [ "$GB" != "-1" ]; then
            echo "retry without glass bezel" >> "$OUT/compile_log.txt"
            clang -fobjc-exceptions -fblocks -Wno-everything -DGLASS_BEZEL=-1 -framework AppKit -framework QuartzCore -framework ApplicationServices "$GITHUB_WORKSPACE_SCRIPTS/inspect5.m" -o "$APP/Contents/MacOS/GlassProbe" >> "$OUT/compile_log.txt" 2>&1
          fi
          echo "== compile log =="; cat "$OUT/compile_log.txt"
          codesign --force -s - "$APP" > /dev/null 2>&1
          # backup recorder from the shell, in case the app is not allowed to record
          screencapture -v -V 150 -x "$OUT/interaction_shell.mov" > /dev/null 2>&1 &
          SHREC=$!
          ( for i in $(seq 1 60); do osascript -e 'tell application id "dev.probe.glass" to activate' > /dev/null 2>&1; sleep 1; done ) &
          NUDGE=$!
          open -n -W --stdout "$OUT/run_stdout.txt" --stderr "$OUT/run_log.txt" "$APP" --args "$OUT"
          echo "open exit $?" >> "$OUT/run_log.txt"
          kill $NUDGE 2> /dev/null
          kill -INT $SHREC 2> /dev/null; sleep 5
          echo "== run log =="; cat "$OUT/run_log.txt"
          echo "== window state =="; cat "$OUT/window_state.txt"
          echo "== timeline =="; head -60 "$OUT/timeline.txt"
          grep -E 'RefractionAmount|RefractionHeight' "$OUT/live_active_layers.txt" | sort | uniq -c
          grep -c '' "$OUT/sweep.txt"; grep -E 'ACTIVE|STATE _interactionState' "$OUT/sweep.txt" | cut -c1-300 | head -20
          ls -la "$OUT"
          true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glassfinal
          path: ${{ runner.temp }}/glassfinal
          if-no-files-found: warn
