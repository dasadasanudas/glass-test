name: mac-replica
on: workflow_dispatch
jobs:
  replica:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: In-app UI, animations, glass states, sweeps
        shell: bash
        run: |
          GITHUB_WORKSPACE_SCRIPTS="$RUNNER_TEMP/scripts"; mkdir -p "$GITHUB_WORKSPACE_SCRIPTS"
          cat > "$GITHUB_WORKSPACE_SCRIPTS/replica.m" <<'OBJC_EOF'
          #import <AppKit/AppKit.h>
          #import <QuartzCore/QuartzCore.h>
          #import <objc/runtime.h>
          #import <objc/message.h>
          #import <dlfcn.h>
          #import <ApplicationServices/ApplicationServices.h>
          #ifndef GLASS_BEZEL
          #define GLASS_BEZEL -1
          #endif

          static FILE *F = NULL;
          static void P(NSString *s) { if (F) { fprintf(F, "%s\n", [s UTF8String]); fflush(F); } }
          static void openOut(NSString *dir, NSString *name) {
              if (F) fclose(F);
              F = fopen([[dir stringByAppendingPathComponent:name] UTF8String], "w");
          }

          static NSString *clip(id v) {
              NSString *d = [[v description] stringByReplacingOccurrencesOfString:@"\n" withString:@" "];
              if ([d length] > 600) d = [[d substringToIndex:600] stringByAppendingString:@"..."];
              return d ? d : @"(nil)";
          }

          static BOOL safeType(const char *a) {
              if (!a || strlen(a) < 2) return NO;
              char t = a[1];
              if (t == '^' || t == '*' || t == ':' || t == '#' || t == '?' || t == 'r') return NO;
              if (t == '@' && a[2] == '?') return NO;
              return YES;
          }

          static void dumpProps(id o, NSString *ind, Class stopAt) {
              NSSet *skip = [NSSet setWithObjects:@"delegate", @"sublayers", @"subviews", @"superlayer", @"superview", @"window",
                             @"contents", @"layoutManager", @"mask", @"style", @"actions", @"description", @"debugDescription",
                             @"hash", @"superclass", @"context", @"presentationLayer", @"modelLayer", @"nextResponder",
                             @"menu", @"layer", @"contentView", @"enclosingScrollView", nil];
              NSMutableSet *seen = [NSMutableSet set];
              Class c = object_getClass(o);
              while (c && c != [NSObject class] && c != stopAt) {
                  unsigned int n = 0;
                  objc_property_t *ps = class_copyPropertyList(c, &n);
                  for (unsigned int i = 0; i < n; i++) {
                      NSString *pn = [NSString stringWithUTF8String:property_getName(ps[i])];
                      const char *a = property_getAttributes(ps[i]);
                      if ([seen containsObject:pn] || [skip containsObject:pn] || !safeType(a)) continue;
                      [seen addObject:pn];
                      @try {
                          id v = [o valueForKey:pn];
                          P([NSString stringWithFormat:@"%@.%@ = %@", ind, pn, clip(v)]);
                      } @catch (NSException *e) { }
                  }
                  free(ps);
                  c = class_getSuperclass(c);
              }
          }

          static void dumpFilter(id f, NSString *ind) {
              P([NSString stringWithFormat:@"%@filter %s : %@", ind, class_getName(object_getClass(f)), clip(f)]);
              for (NSString *k in @[@"name", @"type", @"enabled", @"inputKeys", @"outputKeys"]) {
                  @try { if ([f respondsToSelector:NSSelectorFromString(k)]) P([NSString stringWithFormat:@"%@  .%@ = %@", ind, k, clip([f valueForKey:k])]); } @catch (NSException *e) { }
              }
              @try {
                  if ([f respondsToSelector:NSSelectorFromString(@"inputKeys")]) {
                      for (NSString *k in [f valueForKey:@"inputKeys"]) {
                          @try { P([NSString stringWithFormat:@"%@  [%@] = %@", ind, k, clip([f valueForKey:k])]); } @catch (NSException *e) { }
                      }
                  }
              } @catch (NSException *e) { }
              dumpProps(f, [ind stringByAppendingString:@"  "], [NSObject class]);
          }

          static void walk(CALayer *l, int depth) {
              if (!l || depth > 30) return;
              NSString *ind = [@"" stringByPaddingToLength:depth * 2 withString:@" " startingAtIndex:0];
              CGRect fr = [l frame];
              P([NSString stringWithFormat:@"%@<%s> frame={%.1f,%.1f,%.1f,%.1f} cornerRadius=%.2f opacity=%.2f",
                 ind, class_getName(object_getClass(l)), fr.origin.x, fr.origin.y, fr.size.width, fr.size.height, [l cornerRadius], [l opacity]]);
              for (NSString *k in @[@"filters", @"backgroundFilters", @"compositingFilter"]) {
                  id v = nil;
                  @try { v = [l valueForKey:k]; } @catch (NSException *e) { }
                  if (!v) continue;
                  NSArray *arr = [v isKindOfClass:[NSArray class]] ? v : @[v];
                  for (id f in arr) { P([NSString stringWithFormat:@"%@  %@:", ind, k]); dumpFilter(f, [ind stringByAppendingString:@"    "]); }
              }
              if (object_getClass(l) != [CALayer class]) dumpProps(l, [ind stringByAppendingString:@"    "], [CALayer class]);
              for (NSString *k in @[@"effect", @"effects", @"sdfEffects", @"material", @"glassEffect"]) {
                  @try {
                      if ([l respondsToSelector:NSSelectorFromString(k)]) {
                          id v = [l valueForKey:k];
                          if (v) { P([NSString stringWithFormat:@"%@    effect-ish %@:", ind, k]); dumpFilter(v, [ind stringByAppendingString:@"      "]); }
                      }
                  } @catch (NSException *e) { }
              }
              for (CALayer *s in [[l sublayers] copy]) walk(s, depth + 1);
          }


          static void findGlassFilters(CALayer *l, NSMutableArray *acc, int depth) {
              if (!l || depth > 40) return;
              id v = nil;
              @try { v = [l valueForKey:@"filters"]; } @catch (NSException *e) { }
              if ([v isKindOfClass:[NSArray class]]) {
                  for (id f in v) {
                      @try {
                          if ([[f valueForKey:@"type"] isEqual:@"glassBackground"] || [[f valueForKey:@"type"] isEqual:@"glassForeground"] || [[f valueForKey:@"type"] isEqual:@"vibrantColorMatrix"]) {
                              CALayer *top = l; while ([top superlayer]) top = [top superlayer];
                              CGRect r = [l convertRect:[l bounds] toLayer:top];
                              [acc addObject:@[f, [NSString stringWithFormat:@"@(%.0f,%.0f %.0fx%.0f)", r.origin.x, r.origin.y, r.size.width, r.size.height]]];
                          }
                      } @catch (NSException *e) { }
                  }
              }
              for (CALayer *s in [[l sublayers] copy]) findGlassFilters(s, acc, depth + 1);
          }

          static NSString *filterLine(id pair) {
              NSMutableString *m = [NSMutableString string];
              id f = pair;
              if ([pair isKindOfClass:[NSArray class]]) { f = pair[0]; [m appendFormat:@"%@ ", pair[1]]; }
              @try {
                  [m appendFormat:@"%@:", [f valueForKey:@"type"]];
                  for (NSString *k in [f valueForKey:@"inputKeys"]) {
                      id v = nil;
                      @try { v = [f valueForKey:k]; } @catch (NSException *e) { }
                      if ([v isKindOfClass:[NSNumber class]]) [m appendFormat:@" %@=%@", [k stringByReplacingOccurrencesOfString:@"input" withString:@""], v];
                      else if (v && [k rangeOfString:@"Color"].location != NSNotFound) [m appendFormat:@" %@=%@", [k stringByReplacingOccurrencesOfString:@"input" withString:@""], clip(v)];
                  }
              } @catch (NSException *e) { }
              return m;
          }

          static CFAbsoluteTime REC0 = 0;
          static FILE *TL = NULL;
          static void T(NSString *what) {
              if (!TL) return;
              fprintf(TL, "%.3f  %s\n", CFAbsoluteTimeGetCurrent() - REC0, [what UTF8String]); fflush(TL);
          }
          static CGPoint globalPt(NSWindow *w, NSView *v, CGFloat fx, CGFloat fy) {
              __block CGPoint g = CGPointZero;
              void (^calc)(void) = ^{
                  NSRect r = [v convertRect:[v bounds] toView:nil];
                  NSPoint p = NSMakePoint(NSMinX(r) + fx * NSWidth(r), NSMinY(r) + fy * NSHeight(r));
                  NSPoint sp = [w convertPointToScreen:p];
                  CGFloat H = NSMaxY([[[NSScreen screens] objectAtIndex:0] frame]);
                  g = CGPointMake(sp.x, H - sp.y);
              };
              if ([NSThread isMainThread]) calc(); else dispatch_sync(dispatch_get_main_queue(), calc);
              return g;
          }
          static CGPoint CUR = {5, 5};
          static NSWindow *WIN = nil;
          static int ACCESS = -1;
          static void post(CGEventType t, CGPoint p) {
              if (ACCESS < 0) ACCESS = CGPreflightPostEventAccess() ? 1 : 0;
              CUR = p;
              if (ACCESS == 1) {
                  CGEventRef e = CGEventCreateMouseEvent(NULL, t, p, kCGMouseButtonLeft);
                  if (e) { CGEventPost(kCGHIDEventTap, e); CFRelease(e); }
                  return;
              }
              // fallback: move the real cursor + feed events straight into our own app
              CGWarpMouseCursorPosition(p);
              NSEventType nt;
              if (t == kCGEventLeftMouseDown) nt = NSEventTypeLeftMouseDown;
              else if (t == kCGEventLeftMouseUp) nt = NSEventTypeLeftMouseUp;
              else if (t == kCGEventLeftMouseDragged) nt = NSEventTypeLeftMouseDragged;
              else nt = NSEventTypeMouseMoved;
              dispatch_async(dispatch_get_main_queue(), ^{
                  CGFloat H = NSMaxY([[[NSScreen screens] objectAtIndex:0] frame]);
                  NSPoint wp = [WIN convertPointFromScreen:NSMakePoint(p.x, H - p.y)];
                  NSEvent *e = [NSEvent mouseEventWithType:nt location:wp modifierFlags:0 timestamp:[[NSProcessInfo processInfo] systemUptime]
                                              windowNumber:[WIN windowNumber] context:nil eventNumber:0 clickCount:1 pressure:(nt == NSEventTypeLeftMouseUp ? 0.0 : 1.0)];
                  if (e) [NSApp postEvent:e atStart:NO];
              });
          }
          static void glide(CGPoint to, double secs, BOOL dragging) {
              CGPoint from = CUR;
              int n = (int)(secs * 60.0); if (n < 1) n = 1;
              for (int i = 1; i <= n; i++) {
                  double t = (double)i / n; t = t * t * (3 - 2 * t);
                  post(dragging ? kCGEventLeftMouseDragged : kCGEventMouseMoved, CGPointMake(from.x + (to.x - from.x) * t, from.y + (to.y - from.y) * t));
                  usleep(16000);
              }
          }
          static void sampleGlass(NSView *v, NSString *tag) {
              dispatch_async(dispatch_get_main_queue(), ^{
                  NSMutableArray *fs = [NSMutableArray array];
                  findGlassFilters([[WIN contentView] layer], fs, 0);
                  NSString *hl = @"";
                  if ([v isKindOfClass:[NSButton class]]) hl = [NSString stringWithFormat:@" highlighted=%d", [(NSButton *)v isHighlighted]];
                  if ([fs count] == 0) T([NSString stringWithFormat:@"SAMPLE %@%@ | no glass filter", tag, hl]);
                  for (id f in fs) T([NSString stringWithFormat:@"SAMPLE %@%@ | %@", tag, hl, filterLine(f)]);
              });
          }


          // ======== event-delivering pump (fixes: events were never dispatched before) ========
          static void pump(double secs) {
              NSDate *until = [NSDate dateWithTimeIntervalSinceNow:secs];
              while ([until timeIntervalSinceNow] > 0) {
                  NSEvent *e = [NSApp nextEventMatchingMask:NSEventMaskAny untilDate:[NSDate dateWithTimeIntervalSinceNow:0.01] inMode:NSDefaultRunLoopMode dequeue:YES];
                  if (e) [NSApp sendEvent:e];
              }
          }

          // ======== animation recorder ========
          static NSMutableSet *SEEN = nil;
          static FILE *AF = NULL;
          static FILE *CF = NULL;
          static NSString *tfDesc(CAMediaTimingFunction *tf) {
              if (!tf) return @"nil";
              float c1[2] = {0, 0}, c2[2] = {0, 0};
              [tf getControlPointAtIndex:1 values:c1];
              [tf getControlPointAtIndex:2 values:c2];
              return [NSString stringWithFormat:@"cubic(%.4f,%.4f,%.4f,%.4f)", c1[0], c1[1], c2[0], c2[1]];
          }
          static NSString *animDesc(CAAnimation *a, int depth) {
              if (!a || depth > 4) return @"";
              NSMutableString *m = [NSMutableString stringWithFormat:@"%s dur=%.4f begin=%.4f speed=%.3f fill=%@ tf=%@",
                  class_getName(object_getClass(a)), [a duration], [a beginTime], [a speed], [a fillMode], tfDesc([a timingFunction])];
              @try {
                  if ([a isKindOfClass:[CAPropertyAnimation class]]) [m appendFormat:@" keyPath=%@ additive=%d", [(CAPropertyAnimation *)a keyPath], [(CAPropertyAnimation *)a isAdditive]];
                  if ([a isKindOfClass:[CABasicAnimation class]]) [m appendFormat:@" from=%@ to=%@ by=%@", clip([(CABasicAnimation *)a fromValue]), clip([(CABasicAnimation *)a toValue]), clip([(CABasicAnimation *)a byValue])];
                  if ([a isKindOfClass:[CASpringAnimation class]]) {
                      CASpringAnimation *sp = (CASpringAnimation *)a;
                      [m appendFormat:@" SPRING mass=%.5f stiffness=%.5f damping=%.5f v0=%.5f settle=%.4f", [sp mass], [sp stiffness], [sp damping], [sp initialVelocity], [sp settlingDuration]];
                  }
                  if ([a isKindOfClass:[CAKeyframeAnimation class]]) {
                      CAKeyframeAnimation *k = (CAKeyframeAnimation *)a;
                      [m appendFormat:@" values=%@ keyTimes=%@ calc=%@", clip([k values]), clip([k keyTimes]), [k calculationMode]];
                  }
                  if ([a isKindOfClass:[CAAnimationGroup class]]) {
                      for (CAAnimation *c in [(CAAnimationGroup *)a animations]) [m appendFormat:@" {child: %@}", animDesc(c, depth + 1)];
                  }
                  for (NSString *k in @[@"perceptualDuration", @"bounce", @"preferredFrameRateRange", @"velocity", @"durationAdjustment"]) {
                      if ([a respondsToSelector:NSSelectorFromString(k)]) {
                          @try { [m appendFormat:@" %@=%@", k, clip([a valueForKey:k])]; } @catch (NSException *e) { }
                      }
                  }
              } @catch (NSException *e) { }
              return m;
          }
          static void scanLayer(CALayer *l, int depth, double now) {
              if (!l || depth > 60) return;
              NSArray *keys = nil;
              @try { keys = [l animationKeys]; } @catch (NSException *e) { }
              for (NSString *k in keys) {
                  CAAnimation *a = nil;
                  @try { a = [l animationForKey:k]; } @catch (NSException *e) { }
                  if (!a) continue;
                  if ([a isKindOfClass:[CAPropertyAnimation class]] && CF) {
                      NSString *kp = [(CAPropertyAnimation *)a keyPath];
                      id pv = nil;
                      @try { if (kp) pv = [[l presentationLayer] valueForKeyPath:kp]; } @catch (NSException *e) { }
                      fprintf(CF, "%.4f %s %p %s %s\n", now, class_getName(object_getClass(l)), l, [kp ?: @"?" UTF8String], [clip(pv) UTF8String]);
                  }
                  NSString *ptr = [NSString stringWithFormat:@"%p", a];
                  if ([SEEN containsObject:ptr]) continue;
                  [SEEN addObject:ptr];
                  CGRect b = [l bounds];
                  if (AF) { fprintf(AF, "%.4f layer=%s %p size=%.0fx%.0f key=%s | %s\n", now, class_getName(object_getClass(l)), l, b.size.width, b.size.height, [k UTF8String], [animDesc(a, 0) UTF8String]); fflush(AF); }
              }
              NSArray *subs = nil;
              @try { subs = [[l sublayers] copy]; } @catch (NSException *e) { }
              for (CALayer *s in subs) scanLayer(s, depth + 1, now);
              [subs release];
          }
          static void scanAll(void) {
              double now = CFAbsoluteTimeGetCurrent() - REC0;
              for (NSWindow *w in [[[NSApp windows] copy] autorelease]) {
                  NSView *cv = [w contentView];
                  CALayer *top = [[cv superview] layer] ?: [cv layer];
                  scanLayer(top, 0, now);
              }
              if (CF) fflush(CF);
          }

          // ======== glass state of every window (titlebar, menus, popovers, sheets) ========
          static FILE *SF = NULL;
          static void dumpGlassAll(NSString *step) {
              if (!SF) return;
              for (NSWindow *w in [[[NSApp windows] copy] autorelease]) {
                  if (![w isVisible]) continue;
                  NSView *cv = [w contentView];
                  CALayer *top = [[cv superview] layer] ?: [cv layer];
                  NSMutableArray *fs = [NSMutableArray array];
                  findGlassFilters(top, fs, 0);
                  NSRect fr = [w frame];
                  fprintf(SF, "### %s | window %s level=%ld frame=(%.0f,%.0f %.0fx%.0f) key=%d filters=%lu\n", [step UTF8String], class_getName([w class]),
                          (long)[w level], fr.origin.x, fr.origin.y, fr.size.width, fr.size.height, [w isKeyWindow], (unsigned long)[fs count]);
                  for (id f in fs) fprintf(SF, "    %s\n", [filterLine(f) UTF8String]);
              }
              fflush(SF);
          }
          static void walkWindows(NSString *dir, NSString *step) {
              NSString *safe = [[step componentsSeparatedByCharactersInSet:[[NSCharacterSet alphanumericCharacterSet] invertedSet]] componentsJoinedByString:@"_"];
              openOut(dir, [NSString stringWithFormat:@"tree_%@.txt", safe]);
              for (NSWindow *w in [[[NSApp windows] copy] autorelease]) {
                  if (![w isVisible]) continue;
                  P([NSString stringWithFormat:@"######## window %s title=%@ level=%ld", class_getName([w class]), [w title], (long)[w level]]);
                  walk([[w contentView] layer], 0);
              }
          }

          // ======== tiny helpers: toolbar + table data ========
          @interface TBDelegate : NSObject <NSToolbarDelegate>
          @end
          @implementation TBDelegate
          - (NSArray *)toolbarDefaultItemIdentifiers:(NSToolbar *)t { return @[@"seg", NSToolbarFlexibleSpaceItemIdentifier, @"btn", @"search"]; }
          - (NSArray *)toolbarAllowedItemIdentifiers:(NSToolbar *)t { return [self toolbarDefaultItemIdentifiers:t]; }
          - (NSToolbarItem *)toolbar:(NSToolbar *)t itemForItemIdentifier:(NSToolbarItemIdentifier)ident willBeInsertedIntoToolbar:(BOOL)flag {
              if ([ident isEqual:@"search"]) {
                  Class S = NSClassFromString(@"NSSearchToolbarItem");
                  if (S) return [[[S alloc] initWithItemIdentifier:ident] autorelease];
              }
              NSToolbarItem *it = [[[NSToolbarItem alloc] initWithItemIdentifier:ident] autorelease];
              if ([ident isEqual:@"seg"]) {
                  NSSegmentedControl *sg = [NSSegmentedControl segmentedControlWithLabels:@[@"List", @"Grid"] trackingMode:NSSegmentSwitchTrackingSelectOne target:nil action:nil];
                  [sg setSelectedSegment:0]; [it setView:sg]; [it setLabel:@"View"];
              } else {
                  NSImage *img = [NSImage imageWithSystemSymbolName:@"square.and.arrow.up" accessibilityDescription:@"Share"];
                  if (img) [it setImage:img];
                  [it setLabel:@"Share"]; [it setTarget:nil];
              }
              return it;
          }
          @end
          @interface TableDS : NSObject <NSTableViewDataSource, NSTableViewDelegate>
          @end
          @implementation TableDS
          - (NSInteger)numberOfRowsInTableView:(NSTableView *)tv { return 8; }
          - (NSView *)tableView:(NSTableView *)tv viewForTableColumn:(NSTableColumn *)c row:(NSInteger)r {
              NSArray *names = @[@"Recents", @"Applications", @"Desktop", @"Documents", @"Downloads", @"iCloud Drive", @"Shared", @"Network"];
              NSTableCellView *cell = [[[NSTableCellView alloc] initWithFrame:NSMakeRect(0, 0, 180, 24)] autorelease];
              NSTextField *t = [NSTextField labelWithString:names[r]];
              [t setFrame:NSMakeRect(28, 4, 150, 16)];
              NSImageView *iv = [NSImageView imageViewWithImage:([NSImage imageWithSystemSymbolName:@"folder" accessibilityDescription:nil] ?: [[[NSImage alloc] init] autorelease])];
              [iv setFrame:NSMakeRect(4, 3, 18, 18)];
              [cell addSubview:iv]; [cell addSubview:t]; [cell setTextField:t];
              return cell;
          }
          @end

          // ======== isolated sweep (each glass alone in its own container) ========
          static void runSweep(NSWindow *win, NSView *root, CAGradientLayer *grad, NSString *outdir, NSString *fileName) {
              Class G = NSClassFromString(@"NSGlassEffectView");
              Class GC = NSClassFromString(@"NSGlassEffectContainerView");
              if (!G) return;
              openOut(outdir, fileName);
              P([NSString stringWithFormat:@"reduceTransparency=%d increaseContrast=%d differentiateWithoutColor=%d backingScale=%.1f",
                 [[NSWorkspace sharedWorkspace] accessibilityDisplayShouldReduceTransparency],
                 [[NSWorkspace sharedWorkspace] accessibilityDisplayShouldIncreaseContrast],
                 [[NSWorkspace sharedWorkspace] accessibilityDisplayShouldDifferentiateWithoutColor], [win backingScaleFactor]]);
              for (NSView *v in [[[root subviews] copy] autorelease]) [v removeFromSuperview];
              NSView *box = GC ? [[[GC alloc] initWithFrame:[root bounds]] autorelease] : root;
              if (box != root) [root addSubview:box];
              NSView *g = [[[G alloc] initWithFrame:NSMakeRect(40, 40, 300, 100)] autorelease];
              [box addSubview:g];
              NSMutableArray *shapes = [NSMutableArray array];
              for (int h = 20; h <= 440; h += 20) [shapes addObject:@[@300, @(h), @28]];
              for (int w = 40; w <= 800; w += 60) [shapes addObject:@[@(w), @100, @28]];
              for (int r = 0; r <= 60; r += 10) [shapes addObject:@[@300, @120, @(r)]];
              for (NSString *apn in @[NSAppearanceNameAqua, NSAppearanceNameDarkAqua]) {
                  [win setAppearance:[NSAppearance appearanceNamed:apn]];
                  for (NSArray *sh in shapes) {
                      CGFloat w = [sh[0] doubleValue], h = [sh[1] doubleValue];
                      [g setFrame:NSMakeRect(40, 40, w, h)];
                      @try { [g setValue:sh[2] forKey:@"cornerRadius"]; } @catch (NSException *e) { }
                      pump(0.5);
                      NSMutableArray *fs = [NSMutableArray array];
                      findGlassFilters([root layer], fs, 0);
                      for (id f in fs) P([NSString stringWithFormat:@"%@ w=%.0f h=%.0f r=%@ | %@", [apn isEqual:NSAppearanceNameAqua] ? @"light" : @"dark", w, h, sh[2], filterLine(f)]);
                  }
                  for (int style = 0; style <= 1; style++) {
                      @try { [g setValue:@(style) forKey:@"style"]; } @catch (NSException *e) { }
                      [g setFrame:NSMakeRect(40, 40, 300, 120)];
                      pump(0.6);
                      NSMutableArray *fs = [NSMutableArray array];
                      findGlassFilters([root layer], fs, 0);
                      for (id f in fs) P([NSString stringWithFormat:@"style=%d | %@", style, filterLine(f)]);
                  }
                  @try { [g setValue:@0 forKey:@"style"]; } @catch (NSException *e) { }
                  NSArray *states = @[@[@"_interactionState", @0, @1, @2], @[@"_contentLensing", @0, @1], @[@"_subduedState", @0, @1], @[@"_scrimState", @0, @1]];
                  for (NSArray *st in states) {
                      for (NSUInteger i = 1; i < [st count]; i++) {
                          @try { [g setValue:st[i] forKey:st[0]]; } @catch (NSException *e) { P([NSString stringWithFormat:@"STATE %@ not settable", st[0]]); break; }
                          pump(0.6);
                          NSMutableArray *fs = [NSMutableArray array];
                          findGlassFilters([root layer], fs, 0);
                          for (id f in fs) P([NSString stringWithFormat:@"STATE %@=%@ | %@", st[0], st[i], filterLine(f)]);
                      }
                      @try { [g setValue:st[1] forKey:st[0]]; } @catch (NSException *e) { }
                  }
                  @try { [g setValue:[NSColor systemBlueColor] forKey:@"tintColor"]; pump(0.6);
                      NSMutableArray *fs = [NSMutableArray array]; findGlassFilters([root layer], fs, 0);
                      for (id f in fs) P([NSString stringWithFormat:@"TINT blue | %@", filterLine(f)]);
                      [g setValue:nil forKey:@"tintColor"]; } @catch (NSException *e) { }
              }
              [win setAppearance:nil];
          }

          int main(int argc, const char **argv) {
              @autoreleasepool {
                  NSString *out = argc > 1 ? [NSString stringWithUTF8String:argv[1]] : @".";
                  NSString *mode = argc > 2 ? [NSString stringWithUTF8String:argv[2]] : @"full";
                  [[NSFileManager defaultManager] createDirectoryAtPath:out withIntermediateDirectories:YES attributes:nil error:nil];
                  NSString *trees = [out stringByAppendingPathComponent:@"trees"];
                  [[NSFileManager defaultManager] createDirectoryAtPath:trees withIntermediateDirectories:YES attributes:nil error:nil];
                  SEEN = [[NSMutableSet alloc] init];
                  [NSApplication sharedApplication];
                  [NSApp setActivationPolicy:NSApplicationActivationPolicyRegular];
                  [NSApp finishLaunching];

                  NSWindow *win = [[NSWindow alloc] initWithContentRect:NSMakeRect(60, 80, 900, 600)
                      styleMask:(NSWindowStyleMaskTitled | NSWindowStyleMaskClosable | NSWindowStyleMaskMiniaturizable | NSWindowStyleMaskResizable | NSWindowStyleMaskFullSizeContentView)
                      backing:NSBackingStoreBuffered defer:NO];
                  [win setTitle:@"Replica Probe"];
                  WIN = win;
                  TBDelegate *tbd = [[TBDelegate alloc] init];
                  NSToolbar *tb = [[NSToolbar alloc] initWithIdentifier:@"main"];
                  [tb setDelegate:tbd];
                  [win setToolbar:tb];
                  NSView *root = [[NSView alloc] initWithFrame:NSMakeRect(0, 0, 900, 600)];
                  [root setWantsLayer:YES];
                  CAGradientLayer *grad = [CAGradientLayer layer];
                  grad.colors = @[(id)[[NSColor systemPinkColor] CGColor], (id)[[NSColor systemOrangeColor] CGColor], (id)[[NSColor systemBlueColor] CGColor]];
                  grad.startPoint = CGPointMake(0, 0); grad.endPoint = CGPointMake(1, 1);
                  grad.frame = [root bounds];
                  [grad setAutoresizingMask:(kCALayerWidthSizable | kCALayerHeightSizable)];
                  [[root layer] addSublayer:grad];
                  [win setContentView:root];

