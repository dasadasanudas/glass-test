  sysui:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: System UI packages and screenshots
        shell: bash
        run: |
          set +e
          OUT="$RUNNER_TEMP/sysui"; mkdir -p "$OUT/packages" "$OUT/shots" "$OUT/plists"
          sw_vers > "$OUT/os.txt"
          # 1. Core Animation packages (.ca / .caar / .capackage / .caml): layer trees + animations of system UI
          ROOTS="/System/Library/CoreServices /System/Library/PrivateFrameworks /System/Library/Frameworks /System/Applications /System/Library/ExtensionKit"
          sudo find $ROOTS \( -name "*.ca" -o -name "*.caar" -o -name "*.capackage" -o -name "*.caml" \) 2>/dev/null > "$OUT/ca_packages_all.txt"
          echo "ca packages found: $(wc -l < "$OUT/ca_packages_all.txt")"
          TOTAL=0
          while read -r p; do
            sz=$(du -sk "$p" 2>/dev/null | cut -f1); [ -z "$sz" ] && continue
            [ $((TOTAL + sz)) -gt 400000 ] && continue
            dst="$OUT/packages/$(echo "$p" | sed 's#^/##; s#/#__#g')"
            cp -R "$p" "$dst" 2>/dev/null && TOTAL=$((TOTAL + sz))
          done < "$OUT/ca_packages_all.txt"
          echo "copied KB: $TOTAL"
          # 2. system UI apps: resource listings + their plists
          for app in Dock ControlCenter SystemUIServer NotificationCenter Spotlight WindowManager Finder loginwindow; do
            for base in /System/Library/CoreServices /System/Applications; do
              a="$base/$app.app"; [ -d "$a" ] || continue
              ls -laR "$a/Contents/Resources" > "$OUT/plists/${app}_resources.txt" 2>&1
              cp "$a/Contents/Info.plist" "$OUT/plists/${app}_Info.plist" 2>/dev/null
            done
          done
          defaults read com.apple.dock > "$OUT/plists/dock_defaults.txt" 2>&1
          defaults read com.apple.controlcenter > "$OUT/plists/controlcenter_defaults.txt" 2>&1
          defaults read com.apple.universalaccess > "$OUT/plists/universalaccess_defaults.txt" 2>&1
          # 3. screenshots of system UI the runner can open
          shot() { sleep "$2"; screencapture -x "$OUT/shots/$1.png" 2>> "$OUT/shots/errors.txt"; }
          shot 00_desktop 1
          open -a "Mission Control" 2>> "$OUT/shots/errors.txt"; shot 01_mission_control 1.5; open -a "Mission Control"; sleep 1.5
          open ~ ; shot 02_finder_window 2.5
          open -a "System Settings" 2>> "$OUT/shots/errors.txt"; shot 03_system_settings 4
          osascript -e 'tell application "System Settings" to quit' 2>/dev/null; sleep 1
          open -a "Calculator"; shot 04_calculator 2.5
          open -a "Notes" 2>/dev/null; shot 05_notes 3.5
          open -a "Apps" 2>> "$OUT/shots/errors.txt"; shot 06_apps_launcher 2.5
          osascript -e 'tell application "System Events" to tell process "ControlCenter" to click menu bar item 2 of menu bar 1' 2>> "$OUT/shots/errors.txt"; shot 07_control_center 2
          osascript -e 'tell application "System Events" to key code 53' 2>/dev/null
          osascript -e 'tell application "System Events" to keystroke space using command down' 2>> "$OUT/shots/errors.txt"; shot 08_spotlight 2
          osascript -e 'tell application "System Events" to key code 53' 2>/dev/null
          defaults write com.apple.dock magnification -bool true; defaults write com.apple.dock largesize -int 96; killall Dock; shot 09_dock_restarted 3
          # 4. can the runner record video from the shell?
          screencapture -V 6 -x "$OUT/shots/video_test.mov" 2>> "$OUT/shots/errors.txt"
          ls -la "$OUT/shots"; cat "$OUT/shots/errors.txt" | head -20
          du -sh "$OUT"/* > "$OUT/sizes.txt"; cat "$OUT/sizes.txt"
          true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sysui
          path: ${{ runner.temp }}/sysui
          if-no-files-found: warn
