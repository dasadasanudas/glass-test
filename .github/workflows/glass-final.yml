          <plist version="1.0"><dict>
          <key>CFBundleIdentifier</key><string>dev.probe.replica</string>
          <key>CFBundleName</key><string>ReplicaProbe</string>
          <key>CFBundleExecutable</key><string>ReplicaProbe</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleShortVersionString</key><string>1.0</string>
          <key>LSMinimumSystemVersion</key><string>26.0</string>
          <key>NSPrincipalClass</key><string>NSApplication</string>
          </dict></plist>
          PLIST_EOF
          build() {
            clang -fobjc-exceptions -fblocks -Wno-everything -DGLASS_BEZEL=$1 -framework AppKit -framework QuartzCore -framework ApplicationServices \
              "$GITHUB_WORKSPACE_SCRIPTS/replica.m" -o "$APP/Contents/MacOS/ReplicaProbe" >> "$OUT/compile_log.txt" 2>&1
          }
          build $GB
          if [ ! -x "$APP/Contents/MacOS/ReplicaProbe" ] && [ "$GB" != "-1" ]; then echo "retry without glass bezel" >> "$OUT/compile_log.txt"; build -1; fi
          echo "== compile log =="; cat "$OUT/compile_log.txt"
          codesign --force -s - "$APP" > /dev/null 2>&1
          run_probe() {
            ( for i in $(seq 1 $3); do osascript -e 'tell application id "dev.probe.replica" to activate' > /dev/null 2>&1; sleep 1; done ) &
            local NUDGE=$!
            open -n -W --stdout "$OUT/stdout_$2.txt" --stderr "$OUT/stderr_$2.txt" "$APP" --args "$OUT" "$2"
            echo "open exit $? ($2)" >> "$OUT/stderr_$2.txt"
            kill $NUDGE 2> /dev/null
          }
