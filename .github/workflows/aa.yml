name: glass-input-sweep
on: workflow_dispatch
jobs:
  sweep:
    runs-on: macos-26
    timeout-minutes: 8
    steps:
      - name: Read configured glassBackground inputs across sizes, styles and themes
        shell: bash
        run: |
          set -e
          OUT="$RUNNER_TEMP/glass-input-sweep-output"
          SRC="$RUNNER_TEMP/glass_input_sweep.m"
          BIN="$RUNNER_TEMP/glass_input_sweep"
          mkdir -p "$OUT"
          cat > "$SRC" <<'OBJC_EOF'
          #import <AppKit/AppKit.h>
          #import <QuartzCore/QuartzCore.h>

          static FILE *LOG = NULL;
          static void P(NSString *s) { fprintf(LOG, "%s\n", s.UTF8String); fflush(LOG); }

          static NSArray *KEYS(void) {
              return @[@"inputInnerRefractionAmount", @"inputInnerRefractionHeight", @"inputOuterRefractionAmount", @"inputOuterRefractionHeight",
                       @"inputRefractionDistance0", @"inputRefractionDistance1", @"inputRefractionOpacity", @"inputBlurRadius",
                       @"inputBlurOpacity0", @"inputBlurOpacity1", @"inputBlurOpacity2", @"inputBlurOpacity3", @"inputBlurOpacity4",
                       @"inputBlurDistance0", @"inputBlurDistance1", @"inputBlurDistance2", @"inputBlurDistance3", @"inputBlurDistance4",
                       @"inputFaceOpacity", @"inputFaceColorMatrixWhite", @"inputFaceColorMatrixBlack", @"inputFaceColorMatrixSaturation",
                       @"inputFaceColorMatrixFillColor", @"inputBleedAmount", @"inputBleedHeight", @"inputBleedBlurRadius",
                       @"inputBleedDistance0", @"inputBleedDistance1", @"inputBleedOpacity", @"inputBleedDarkenBlend",
                       @"inputBleedColorMatrixWhite", @"inputBleedColorMatrixBlack", @"inputBleedColorMatrixSaturation", @"inputBleedColorMatrixFillColor",
                       @"inputShadowOffset", @"inputShadowAmount", @"inputShadowHeight", @"inputShadowOpacity",
                       @"inputShadowColorMatrixWhite", @"inputShadowColorMatrixBlack", @"inputShadowColorMatrixSaturation", @"inputShadowColorMatrixFillColor",
                       @"inputShadowDistanceOffset", @"inputShadowBlurRadius", @"inputShadowRadius",
                       @"inputSDRHoldingToneEnabled", @"inputSDRHoldingToneWhite", @"inputSDRGradientDistance0", @"inputSDRGradientDistance1",
                       @"inputSDRShadowOpacity", @"inputMaxHeadroom", @"inputShadowVibrancyContribution", @"inputClamp", @"inputClampPreserveHue"];
          }

          // Walk the layer tree and print every glassBackground filter's configured inputs.
          static void walkLayer(CALayer *layer, NSString *tag) {
              if (!layer) return;
              for (id filter in layer.filters) {
                  NSString *name = @"";
                  @try { name = [filter valueForKey:@"name"] ?: @""; } @catch (NSException *e) { }
                  if (![name isEqualToString:@"glassBackground"]) continue;
                  P([NSString stringWithFormat:@"BEGIN %@ layerFrame=%@", tag, NSStringFromRect(layer.frame)]);
                  for (NSString *k in KEYS()) {
                      @try {
                          id v = [filter valueForKey:k];
                          if (v) P([NSString stringWithFormat:@"%@ = %@", k, v]);
                      } @catch (NSException *e) { P([NSString stringWithFormat:@"%@ = <error %@>", k, e.reason]); }
                  }
                  P([NSString stringWithFormat:@"END %@", tag]);
              }
              for (CALayer *sub in layer.sublayers) walkLayer(sub, tag);
          }

          @interface SweepWindow : NSWindow
          @end
          @implementation SweepWindow
          - (BOOL)canBecomeKeyWindow { return YES; }
          - (BOOL)canBecomeMainWindow { return YES; }
          @end

          static void pumpFor(double seconds) {
              NSDate *until = [NSDate dateWithTimeIntervalSinceNow:seconds];
              while ([until timeIntervalSinceNow] > 0) {
                  NSEvent *e = [NSApp nextEventMatchingMask:NSEventMaskAny untilDate:[NSDate dateWithTimeIntervalSinceNow:0.02] inMode:NSDefaultRunLoopMode dequeue:YES];
                  if (e) [NSApp sendEvent:e];
              }
          }

          int main(int argc, const char **argv) {
              @autoreleasepool {
                  NSString *out = argc > 1 ? [NSString stringWithUTF8String:argv[1]] : @".";
                  [[NSFileManager defaultManager] createDirectoryAtPath:out withIntermediateDirectories:YES attributes:nil error:nil];
                  LOG = fopen([[out stringByAppendingPathComponent:@"sweep.txt"] UTF8String], "w");

                  [NSApplication sharedApplication];
                  [NSApp setActivationPolicy:NSApplicationActivationPolicyRegular];
                  [NSApp finishLaunching];

                  SweepWindow *win = [[SweepWindow alloc] initWithContentRect:NSMakeRect(100, 100, 900, 600)
                                                                    styleMask:NSWindowStyleMaskTitled
                                                                      backing:NSBackingStoreBuffered
                                                                        defer:NO];
                  NSView *root = [[NSView alloc] initWithFrame:NSMakeRect(0, 0, 900, 600)];
                  [root setWantsLayer:YES];
                  [win setContentView:root];

                  Class G = NSClassFromString(@"NSGlassEffectView");
                  Class C = NSClassFromString(@"NSGlassEffectContainerView");
                  P([NSString stringWithFormat:@"classes glass=%@ container=%@", G, C]);
                  if (!G) { P(@"NSGlassEffectView missing on this OS"); fclose(LOG); return 0; }

                  // name, width, height, corner radius
                  NSArray *sizes = @[@[@"60x60", @60, @60, @30], @[@"160x44", @160, @44, @22], @[@"300x100", @300, @100, @28],
                                     @[@"300x200", @300, @200, @28], @[@"600x300", @600, @300, @40]];
                  // name, dark (0/1), style (0 regular, 1 clear)
                  NSArray *modes = @[@[@"light_regular", @0, @0], @[@"light_clear", @0, @1], @[@"dark_regular", @1, @0], @[@"dark_clear", @1, @1]];

                  [NSApp activateIgnoringOtherApps:YES];
                  [win makeKeyAndOrderFront:nil];
                  pumpFor(1.0);

                  for (NSArray *mode in modes) {
                      for (NSArray *size in sizes) {
                          NSArray *old = [root.subviews copy];
                          for (NSView *v in old) [v removeFromSuperview];

                          BOOL dark = [mode[1] intValue] != 0;
                          [win setAppearance:[NSAppearance appearanceNamed:(dark ? NSAppearanceNameDarkAqua : NSAppearanceNameAqua)]];

                          NSView *box = C ? [[C alloc] initWithFrame:root.bounds] : root;
                          if (box != root) [root addSubview:box];

                          NSView *glass = [[G alloc] initWithFrame:NSMakeRect(100, 100, [size[1] doubleValue], [size[2] doubleValue])];
                          @try {
                              [glass setValue:size[3] forKey:@"cornerRadius"];
                              [glass setValue:mode[2] forKey:@"style"];
                          } @catch (NSException *e) {
                              P([NSString stringWithFormat:@"setValue failed %@", e.reason]);
                          }
                          [box addSubview:glass];

                          [win makeKeyAndOrderFront:nil];
                          pumpFor(1.0);
                          NSString *tag = [NSString stringWithFormat:@"%@_%@", mode[0], size[0]];
                          walkLayer(root.layer, tag);
                      }
                  }
                  P(@"DONE");
                  fclose(LOG);
              }
              return 0;
          }

          OBJC_EOF
          defaults write com.apple.universalaccess reduceTransparency -bool false
          clang -fobjc-arc -fobjc-exceptions -Wno-everything -framework AppKit -framework QuartzCore "$SRC" -o "$BIN"
          codesign -s - -f "$BIN" >/dev/null 2>&1 || true
          "$BIN" "$OUT"
          cat "$OUT/sweep.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glassinputsweep
          path: ${{ runner.temp }}/glass-input-sweep-output
          if-no-files-found: warn
